name: Allure Report

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  USERNAME: ${{ secrets.USER }}
  PASSWORD: ${{ secrets.PASSWORD }}

permissions:
  contents: write

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests with Allure
        run: |
          mvn clean test -Duser=$USERNAME -Dpassword=$PASSWORD -U

      # Шаг верификации результатов (опционально)
      - name: Verify Allure results
        run: |
          echo "Allure results files:"
          ls -la target/allure-results/

      # Исправленный шаг генерации отчета
      - name: Generate Allure report
        if: always()
        run: |
          # Явное указание плагина с группой
          mvn io.qameta.allure:allure-maven-plugin:report -Dallure.results.directory=target/allure-results
          
          # Создаем симлинк для правильного отображения
          ln -sf allure-maven-plugin/index.html target/site/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: target/site
          destination_dir: ./
          keep_files: true

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin